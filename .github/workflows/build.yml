name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create env files
        run: |
          echo "GEMINI_API_KEY=dummy_key" > kora_project/.env
          echo "GEMINI_API_KEY=dummy_key" > kora_project/.env.example

      - name: Build debug APK
        run: |
          cd kora_project
          gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: kora_project/app/build/outputs/apk/debug/*.apk
