name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f "kora_project/gradlew" ]; then
            cd kora_project && gradle wrapper && cd ..
          fi
          chmod +x kora_project/gradlew

      - name: Create .env file
        run: echo "GEMINI_API_KEY=dummy_key" > kora_project/.env

      - name: Build debug APK
        run: |
          cd kora_project
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: kora_project/app/build/outputs/apk/debug/*.apk
